name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    env:
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Check the release tag matches sdkVersion
        if: github.event_name == 'release'
        run: |
          version="$(grep '^sdkVersion=' gradle.properties | cut -d= -f2)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The tag $GITHUB_REF_NAME does not match sdkVersion $version in gradle.properties"
            exit 1
          fi
      - name: Check the publishing secrets are set
        run: |
          for name in mavenCentralUsername mavenCentralPassword signingInMemoryKey signingInMemoryKeyId signingInMemoryKeyPassword; do
            variable="ORG_GRADLE_PROJECT_$name"
            if [ -z "${!variable}" ]; then
              echo "::error::$variable is empty. Add the secrets listed in RELEASING.md."
              exit 1
            fi
          done
      - name: Unit tests and release build
        run: ./gradlew testDebugUnitTest assembleRelease
      - name: Sign and upload to the Central Portal
        run: ./gradlew publishToMavenCentral --no-configuration-cache
