name: Release

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate the deployment on the Central Portal, then drop it instead of publishing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      dry_run: ${{ steps.mode.outputs.dry_run }}

    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Read the version
        id: version
        run: echo "version=$(grep '^sdkVersion=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Check the release tag matches the version
        if: github.event_name == 'release'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::The tag $GITHUB_REF_NAME does not match sdkVersion $VERSION in gradle.properties"
            exit 1
          fi

      - name: Check the changelog and README name the same version
        run: scripts/check-version.sh

      - name: Decide between a release and a dry run
        id: mode
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: echo "dry_run=$DRY_RUN" >> "$GITHUB_OUTPUT"

      - name: Check the repository is public before a release
        if: steps.mode.outputs.dry_run != 'true' && github.event.repository.private
        run: |
          echo "::error::Make the repository public before releasing. The published POMs link to it, and the maven-central approval gate needs a public repository on GitHub's free plan."
          exit 1

  test:
    name: Test
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run the unit tests and the release build, sample app included
        run: ./gradlew testDebugUnitTest assembleRelease :sample:lintDebug

  build:
    name: Build and sign
    needs: [verify, test]
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Check the signing secrets are set
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          for name in SIGNING_KEY SIGNING_KEY_ID SIGNING_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::The $name secret is empty. See RELEASING.md."
              exit 1
            fi
          done

      - name: Build and sign the artifacts into the staging repository
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew publishAllPublicationsToStagingRepository --no-configuration-cache

      - name: Check every artifact is complete, signed and checksummed
        run: scripts/check-publication.sh --signed build/staging-repository

      - name: Zip the Central Portal bundle
        working-directory: build/staging-repository
        run: zip -qr ../central-bundle.zip com -x '*maven-metadata*'

      - name: Keep the bundle for the upload
        uses: actions/upload-artifact@v6
        with:
          name: central-bundle-${{ needs.verify.outputs.version }}
          path: build/central-bundle.zip
          retention-days: 7
          if-no-files-found: error

  upload:
    name: Upload and validate
    needs: [verify, build]
    runs-on: ubuntu-latest
    outputs:
      deployment_id: ${{ steps.upload.outputs.deployment_id }}
    env:
      MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}

    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Fetch the bundle
        uses: actions/download-artifact@v7
        with:
          name: central-bundle-${{ needs.verify.outputs.version }}

      - name: Upload the bundle to the Central Portal
        id: upload
        env:
          NAME: brudcast-sdk-android-${{ needs.verify.outputs.version }}
        run: |
          id="$(scripts/central-portal.sh upload central-bundle.zip "$NAME")"
          echo "deployment_id=$id" >> "$GITHUB_OUTPUT"
          echo "Uploaded deployment $id"

      - name: Wait for the Portal to validate the deployment
        env:
          DEPLOYMENT_ID: ${{ steps.upload.outputs.deployment_id }}
        run: scripts/central-portal.sh wait "$DEPLOYMENT_ID" VALIDATED

      - name: Summarise the deployment
        env:
          DEPLOYMENT_ID: ${{ steps.upload.outputs.deployment_id }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          {
            echo "### Validated on the Central Portal"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Version | \`$VERSION\` |"
            echo "| Deployment | \`$DEPLOYMENT_ID\` |"
            echo
            echo "[Open it in the Portal](https://central.sonatype.com/publishing/deployments)"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish to Maven Central
    needs: [verify, upload]
    if: needs.verify.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    environment: maven-central
    env:
      MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      DEPLOYMENT_ID: ${{ needs.upload.outputs.deployment_id }}

    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Publish the deployment
        run: scripts/central-portal.sh publish "$DEPLOYMENT_ID"

      - name: Wait for Maven Central to publish it
        run: scripts/central-portal.sh wait "$DEPLOYMENT_ID" PUBLISHED

      - name: Summarise the release
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          {
            echo "### Published $VERSION to Maven Central"
            echo
            echo "It reaches [repo1.maven.org](https://repo1.maven.org/maven2/com/brudcast/) within about 30 minutes."
          } >> "$GITHUB_STEP_SUMMARY"

  drop:
    name: Drop the deployment
    needs: [upload, publish]
    if: always() && needs.upload.result == 'success' && needs.publish.result != 'success'
    runs-on: ubuntu-latest
    env:
      MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      DEPLOYMENT_ID: ${{ needs.upload.outputs.deployment_id }}

    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Drop the deployment from the Central Portal
        run: scripts/central-portal.sh drop "$DEPLOYMENT_ID"
