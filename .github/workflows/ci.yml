name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and release build, sample app included
        run: ./gradlew testDebugUnitTest assembleRelease :sample:lintDebug
      - name: Publish to Maven Local and check every artifact is complete
        run: |
          ./gradlew publishToMavenLocal
          scripts/check-publication.sh
