name: CI

on:
  push:
    branches: [main, develop]

  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Check the changelog and README name sdkVersion
        run: scripts/check-version.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run the unit tests and the release build, sample app included
        run: ./gradlew testDebugUnitTest assembleRelease :sample:lintDebug

      - name: Publish to Maven Local
        run: ./gradlew publishToMavenLocal

      - name: Check every artifact is complete
        run: scripts/check-publication.sh
