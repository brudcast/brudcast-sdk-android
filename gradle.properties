org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
sdkVersion=0.1.0

# Publishing to Maven Central through the Central Portal, read by com.vanniktech.maven.publish.
# Credentials and the signing key come from the environment, and publications are signed only
# when a key is set (see build.gradle.kts and RELEASING.md).
mavenCentralPublishing=true
mavenCentralAutomaticPublishing=false

POM_INCEPTION_YEAR=2026
POM_URL=https://github.com/brudcast/brudcast-sdk-android
POM_LICENSE_NAME=The Apache Software License, Version 2.0
POM_LICENSE_URL=https://www.apache.org/licenses/LICENSE-2.0.txt
POM_LICENSE_DIST=repo
POM_SCM_URL=https://github.com/brudcast/brudcast-sdk-android
POM_SCM_CONNECTION=scm:git:https://github.com/brudcast/brudcast-sdk-android.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/brudcast/brudcast-sdk-android.git
POM_DEVELOPER_ID=brudcast
POM_DEVELOPER_NAME=Brudcast
POM_DEVELOPER_URL=https://brudcast.com
